apiVersion: v1
kind: Pod
metadata:
  name: devapp
  namespace: dev
spec:
  containers:
  - name: boxone
    image: docker.io/lovelearnlinux/webserver:v1
    volumeMounts:                       #location inside the configmap
     - name: configfile
       mountPath: "/etc/httpd/conf/"
       readOnly: true
     - name: datafile
       mountPath: "/var/www/html/"
  volumes:                            #configmap name
  - name: configfile
    configMap:
      name: apacheconfig
  - name: datafile
    configMap:
      name: apachedata
