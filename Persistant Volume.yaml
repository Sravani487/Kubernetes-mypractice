apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvone
  namespace: dev
spec:
  claimRef:
    name: pvcone
    namespace: dev
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
  nfs:
    path: /appone
    server: 10.0.0.200
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvcone
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: pvone
